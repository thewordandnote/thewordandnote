<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://thewordandnote.com/">
<title>Content Writing Services & SEO Copywriting Agency | The Word & Note</title>
<meta name="description" content="Get 100% original human-written content, SEO blogs, website copy and social media content that builds trust and drives business growth.">

<meta name="theme-color" content="#0B0F19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F19;--card:#131a2b;--line:#222c45;--txt:#e8ecf6;--mut:#97a3c0;--a:#7c5cff;--b:#22d3ee;--g:linear-gradient(120deg,#7c5cff,#22d3ee)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.7 Inter,system-ui,sans-serif;overflow-x:hidden;padding-top:36px}
h1,h2,h3,h4,.btn,nav a{font-family:Poppins,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:0 22px}
.top-bar{background:#070a12;border-bottom:1px solid var(--line);height:36px;display:flex;align-items:center;font-size:13px}
.top-bar .wrap{display:flex;justify-content:flex-end;align-items:center;gap:14px;width:100%}
.top-bar a{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:500;transition:.2s}
.top-bar a:hover{color:#fff}
.top-bar .wa svg{color:#25D366}
.top-bar .sep{color:var(--line)}
header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(11,15,25,.88);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:800 21px Poppins;letter-spacing:-.5px;display:flex;align-items:center}.logo span{background:var(--g);-webkit-background-clip:text;color:transparent}
.logo img{height:35px;width:auto;margin-right:10px}
nav{display:flex;gap:26px;align-items:center}nav a{font-size:14px;font-weight:500;color:var(--mut);transition:.2s}nav a:hover,nav a.on{color:#fff}
.btn{display:inline-block;padding:13px 26px;border-radius:50px;background:var(--g);color:#fff!important;font-weight:600;font-size:15px;border:0;cursor:pointer;transition:.3s;box-shadow:0 8px 30px rgba(124,92,255,.35)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(34,211,238,.35)}
.btn.o{background:transparent;border:1px solid var(--line);box-shadow:none}
#burger{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
section{padding:90px 0}
.tag{display:inline-block;font:600 12px Poppins;letter-spacing:2px;text-transform:uppercase;color:var(--b);margin-bottom:12px}
h2{font-size:clamp(28px,4vw,44px);line-height:1.2;margin-bottom:16px;font-weight:700}
.sub{color:var(--mut);max-width:640px}.c{text-align:center}.c .sub{margin:auto}
.grad{background:var(--g);-webkit-background-clip:text;color:transparent}
.hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:fl 9s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--a);top:-80px;left:-100px}.b2{width:380px;height:380px;background:var(--b);bottom:-100px;right:-60px;animation-delay:-4s}
@keyframes fl{50%{transform:translate(40px,30px) scale(1.1)}}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,62px);line-height:1.1;font-weight:800;margin:14px 0 20px}
.hero p{color:var(--mut);font-size:18px;margin-bottom:30px}.hero .btn{margin:0 10px 10px 0}
.vis{position:relative;height:380px}
.fc{position:absolute;background:rgba(19,26,43,.9);border:1px solid var(--line);border-radius:18px;padding:18px 22px;backdrop-filter:blur(8px);animation:fl 6s ease-in-out infinite;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.fc b{display:block;font:700 28px Poppins}.fc small{color:var(--mut)}
.f1{top:10px;left:10px}.f2{top:130px;right:0;animation-delay:-2s}.f3{bottom:10px;left:50px;animation-delay:-4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:-40px;position:relative;z-index:2}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
.st b{font:800 40px Poppins;display:block}.st span{color:var(--mut);font-size:14px}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:22px 0;margin-top:70px}
.mq div{display:flex;gap:60px;width:max-content;animation:mq 25s linear infinite;color:var(--mut);font:600 18px Poppins}
@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:46px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;transition:.35s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-8px);border-color:var(--a);box-shadow:0 20px 50px rgba(124,92,255,.2)}
.card .n{font:800 15px Poppins;color:var(--b);margin-bottom:14px;display:block}
.card h3{font-size:20px;margin-bottom:10px}.card p{color:var(--mut);font-size:15px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.ck{list-style:none;margin-top:20px}.ck li{padding:8px 0 8px 34px;position:relative}.ck li:before{content:"✓";position:absolute;left:0;width:22px;height:22px;border-radius:50%;background:var(--g);font-size:12px;display:grid;place-items:center;top:11px}
.q{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px;font:500 20px/1.6 Poppins}
.cta{background:var(--g);border-radius:28px;padding:60px 30px;text-align:center}.cta .btn{background:#0B0F19;box-shadow:none}
footer{border-top:1px solid var(--line);padding:50px 0 30px;margin-top:40px}.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}
footer p,footer a{color:var(--mut);font-size:14px;display:block;margin:6px 0}footer a:hover{color:#fff}
.socials{display:flex;gap:12px;margin-top:14px}
.socials a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--mut);margin:0;transition:.25s}
.socials a:hover{border-color:var(--b);color:#fff;transform:translateY(-2px);background:rgba(124,92,255,.2)}
.cp{text-align:center;margin-top:34px;color:var(--mut);font-size:13px}
.rv{opacity:0;transform:translateY(36px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.v{opacity:1;transform:none}
#cb{position:fixed;right:22px;bottom:22px;z-index:60}
